get_capability_map:
  name: Get Capability Map
  description: Compile a complete capability map of the Home Assistant instance, including active integrations, areas, devices, active entities, orphaned entities, and proactive suggestions.

get_suggestions:
  name: Get Proactive Suggestions
  description: Retrieve intelligent proactive suggestions generated by Otis AI based on current areas, entities, and configurations.

apply_suggestion:
  name: Apply Proactive Suggestion
  description: Automatically apply a proactive suggestion (e.g., generate an automation, script, or cleanup orphaned entities).
  fields:
    suggestion_id:
      name: Suggestion ID
      description: The unique identifier of the suggestion to apply.
      required: true
      selector:
        text:

chat:
  name: Chat with Otis
  description: Conversational smart home co-pilot query with active spatial capability context and transparent LLM fallback.
  fields:
    text:
      name: Message
      description: The text sentence or query to send to Otis AI.
      required: true
      selector:
        text:
    conversation_id:
      name: Conversation ID
      description: Optional conversation identifier for maintaining multi-turn context.
      required: false
      selector:
        text:
    attachments:
      name: Attachments
      description: Optional list of files or images attached to the chat prompt.
      required: false
      selector:
        object:

get_spatial_map:
  name: Get Spatial Adjacency Map
  description: Retrieve the spatial connection topology and area adjacency graph representing physical connections between rooms in the home.

update_spatial_map:
  name: Update Spatial Adjacency Connection
  description: Connect or disconnect two physical areas in the spatial adjacency topology.
  fields:
    area_1:
      name: Area 1
      description: The ID or name of the first area (e.g., 'foyer', 'kitchen').
      required: true
      selector:
        text:
    area_2:
      name: Area 2
      description: The ID or name of the second area (e.g., 'hallway', 'great_room').
      required: true
      selector:
        text:
    connected:
      name: Connected
      description: Whether the two areas are physically connected/adjacent.
      default: true
      selector:
        boolean:
    connection_type:
      name: Connection Type
      description: The physical transition type between the areas ('door', 'open', 'hallway', 'stairs').
      default: open
      selector:
        select:
          options:
            - door
            - open
            - hallway
            - stairs

generate_floorplan:
  name: Generate Floor Plan SVG
  description: Synthesize an interactive vector SVG floor plan with multi-floor and outdoor views based on spatial adjacency and walkthrough inputs.
  fields:
    theme:
      name: Theme
      description: Visual color aesthetic for the floor plan ('cyberpunk', 'blueprint', 'emerald').
      default: cyberpunk
      selector:
        select:
          options:
            - cyberpunk
            - blueprint
            - emerald
    output_path:
      name: Output File Path
      description: Destination path relative to Home Assistant config (defaults to 'www/otis_floorplan.svg').
      default: www/otis_floorplan.svg
      selector:
        text:
    video_path:
      name: Walkthrough Video Path
      description: Optional path to an uploaded walkthrough video file to parse room callouts.
      required: false
      selector:
        text:

update_floorplan_layout:
  name: Update Floor Plan Layout
  description: Reposition device marker badges and adjust room boundary polygon coordinates directly on the vector SVG floor plan.
  fields:
    badges:
      name: Device Marker Badges
      description: List of device markers with entity_id, x, and y coordinates.
      selector:
        object:
    rooms:
      name: Room Boundaries
      description: List of rooms with id, x, y, width, height, or polygon points.
      selector:
        object:
    deleted_rooms:
      name: Deleted Room IDs
      description: List of area/room IDs to delete and remove from the vector floor plan.
      selector:
        object:
    svg_path:
      name: Floor Plan SVG Path
      description: Destination SVG path relative to Home Assistant config.
      default: www/otis_floorplan.svg
      selector:
        text:

pin_floorplan_entity:
  name: Pin Floor Plan Entity
  description: Pin or reposition an entity badge on the 2D floorplan by room area or explicit coordinates.
  fields:
    entity_id:
      name: Entity ID
      description: Home Assistant entity ID to pin (e.g. light.patio_lights).
      required: true
      selector:
        entity:
    area_id:
      name: Room Area ID
      description: Target room area to place the pin in (e.g. dining_room or backyard).
      selector:
        area:
    x:
      name: X Coordinate
      description: Explicit horizontal coordinate on the vector canvas (0-1300).
      selector:
        number:
          min: 0
          max: 1300
    y:
      name: Y Coordinate
      description: Explicit vertical coordinate on the vector canvas.
      selector:
        number:
          min: 0
          max: 2000
    svg_path:
      name: Floor Plan SVG Path
      description: Destination SVG path relative to Home Assistant config.
      default: www/otis_floorplan.svg
      selector:
        text:

unpin_floorplan_entity:
  name: Unpin Floor Plan Entity
  description: Remove an entity badge pin from the interactive floor plan.
  fields:
    entity_id:
      name: Entity ID
      description: Home Assistant entity ID to unpin.
      required: true
      selector:
        entity:
    svg_path:
      name: Floor Plan SVG Path
      description: Destination SVG path relative to Home Assistant config.
      default: www/otis_floorplan.svg
      selector:
        text:

generate_theme:
  name: Generate Custom Theme
  description: Generate custom Home Assistant theme definitions directly into /config/themes/otis_<theme_name>.yaml from natural language prompts or presets and automatically reload themes.
  fields:
    prompt:
      name: Theme Prompt
      description: Natural language styling instruction (e.g., 'Cyberpunk neon dark mode with glowing cyan accents and 16px rounded cards').
      required: true
      selector:
        text:
    name:
      name: Theme Name
      description: Optional display name for the theme.
      required: false
      selector:
        text:
    base_palette:
      name: Base Palette Preset
      description: Optional base palette preset ('cyberpunk', 'midnight_slate', 'oled_black', 'sunset_amber', 'emerald_luxury', 'nordic_frost', 'high_contrast').
      required: false
      selector:
        select:
          options:
            - cyberpunk
            - midnight_slate
            - oled_black
            - sunset_amber
            - emerald_luxury
            - nordic_frost
            - high_contrast
    dark_mode:
      name: Dark Mode
      description: Whether the theme is dark mode (true) or light mode (false).
      default: true
      selector:
        boolean:
    border_radius:
      name: Border Radius
      description: Optional border radius override (e.g. '14px', '8px', '0px').
      required: false
      selector:
        text:
    glow_effect:
      name: Glow Effect
      description: Whether cards feature a glowing luminous neon shadow border.
      required: false
      selector:
        boolean:
    apply_immediately:
      name: Apply Immediately
      description: Whether to set and activate this theme immediately across the Home Assistant frontend.
      default: false
      selector:
        boolean:

apply_theme:
  name: Apply Theme
  description: Instantly activate a Home Assistant theme across the frontend.
  fields:
    name:
      name: Theme Name / Key
      description: Theme name or key (e.g., 'otis_cyberpunk', 'otis_midnight_slate').
      required: true
      selector:
        text:
    mode:
      name: Mode
      description: Optional display mode ('dark', 'light', 'auto').
      required: false
      selector:
        select:
          options:
            - dark
            - light
            - auto

list_themes:
  name: List Otis Themes
  description: List all Otis-generated custom themes in /config/themes/ with their color swatches and style properties.

delete_theme:
  name: Delete Otis Theme
  description: Remove a custom Otis theme file from /config/themes/ and reload themes.
  fields:
    name:
      name: Theme Key
      description: Theme key or slug to delete (e.g., 'otis_cyberpunk').
      required: true
      selector:
        text:

run_sentinel_watchdog:
  name: Run Sentinel Watchdog Audit
  description: Run comprehensive Otis Sentinel telemetry scan across climate short-cycling, battery drain, stuck security perimeter access, unresponsive BLE proxies, stuck switches, and mesh routing health.
  fields:
    auto_remediate:
      name: Auto-Remediate
      description: Automatically execute self-healing remediations for safe detected anomalies (e.g. Turn off runaway lights/fans, reload failed integrations, restart BLE proxies, ping dead mesh nodes).
      default: false
      selector:
        boolean:

remediate_anomaly:
  name: Remediate Sentinel Anomaly
  description: Trigger 1-click self-healing remediation for an anomaly detected by Otis Sentinel.
  fields:
    anomaly_id:
      name: Anomaly ID
      description: Identifier of the anomaly to remediate.
      required: true
      selector:
        text:
    action:
      name: Action Override
      description: Optional remediation action override (e.g., 'secure_perimeter_entity', 'adjust_climate_target', 'reload_config_entry', 'turn_off_stuck_actuator', 'restart_ble_proxy', 'heal_mesh_node', 'notify_battery_replacement', 'dismiss').
      required: false
      selector:
        text:

get_sentinel_telemetry:
  name: Get Sentinel Telemetry
  description: Retrieve live Sentinel anomaly monitoring status, active anomalies list, and remediation history.

ignore_sentinel_alert:
  name: Ignore Sentinel Alert
  description: Mute a specific Sentinel alert or an entire alert category from the Proactive Feed.
  fields:
    anomaly_id:
      name: Anomaly ID
      description: Specific anomaly ID to mute (optional if all_in_category is true).
      required: false
      selector:
        text:
    category:
      name: Alert Category
      description: Category to mute (e.g. 'battery', 'offline_node').
      required: false
      selector:
        text:
    all_in_category:
      name: Ignore All in Category
      description: Set to true to mute all current and future alerts in this category.
      required: false
      selector:
        boolean:

sync_dashboards:
  name: Sync Dashboards
  description: Synchronize Studios (Floor Plan, Media, Security, Climate, Energy) and Room views from the Otis AI Companion dashboard to the user Command Center dashboard.
  fields:
    regenerate:
      name: Force Clean Regeneration
      description: Rebuild all views from scratch using current user style preferences (layout, navigation style, calendar view) without preserving stale layouts.
      required: false
      selector:
        boolean:

regenerate_dashboards:
  name: Regenerate Command Center & Studios
  description: Cleanly rebuild the Command Center, all Studios (Media, Security, Climate & Pool, Energy, Floor Plan), and Room subviews using the latest layout and style preferences.

create_command_center:
  name: Create / Sync User Command Center
  description: Generate or refresh the non-admin User Command Center dashboard (/command-center) connecting Studios and Room subviews for family members.

execute_macro:
  name: Execute Macro Sequence
  description: Execute a multi-step smart home macro sequence with pre-flight safety checks and prior state snapshotting for 1-click rollback.
  fields:
    macro_name:
      name: Macro Name / Template
      description: Built-in macro template name ('movie_night', 'goodnight', 'party_mode', 'away_mode', 'welcome_home') or custom display name.
      required: false
      selector:
        text:
    steps:
      name: Macro Steps
      description: Optional list of customized action steps to execute sequentially.
      required: false
      selector:
        object:
    confirmed:
      name: Confirmed
      description: Explicit confirmation flag to bypass pre-flight safety prompts for critical steps (e.g. locks/disarm).
      default: false
      selector:
        boolean:
    macro_id:
      name: Macro ID
      description: Unique identifier for tracking and pending confirmations.
      required: false
      selector:
        text:

rollback_macro:
  name: Rollback Macro
  description: Roll back the most recently executed macro (or specified macro ID), restoring all target entities to their exact pre-execution state.
  fields:
    macro_id:
      name: Macro ID
      description: Specific macro execution ID to roll back (defaults to latest executed macro).
      required: false
      selector:
        text:

list_macros:
  name: List Macros & Execution History
  description: List available built-in smart macro templates and recent execution history with rollback statuses.

audio_handoff:
  name: Audio Handoff
  description: Transfer or mirror playing audio between rooms across multi-zone matrix amplifiers and media players, validated via Spatial Adjacency.
  fields:
    source_area:
      name: Source Area / Room
      description: The room/area currently playing audio or being departed.
      required: true
      selector:
        text:
    target_area:
      name: Target Area / Room
      description: The room/area being entered where audio should follow or transfer.
      required: true
      selector:
        text:
    mode:
      name: Handoff Mode
      description: Mode of transfer ('handoff' moves audio and turns off source room; 'follow' or 'mirror' keeps both rooms synchronized).
      default: handoff
      selector:
        select:
          options:
            - handoff
            - follow
            - mirror
    idle_power_guard:
      name: Idle Power Guard
      description: Automatically check for and release idle upstream streamer and amplifier sources.
      default: true
      selector:
        boolean:

media_follow_me:
  name: Media Follow-Me Routing
  description: Dynamically evaluate presence and follow user audio into newly entered rooms.
  fields:
    source_area:
      name: Source Area
      required: true
      selector:
        text:
    target_area:
      name: Target Area
      required: true
      selector:
        text:
    mode:
      name: Mode
      default: follow
      selector:
        select:
          options:
            - follow
            - handoff

release_idle_sources:
  name: Release Idle Matrix Sources
  description: Inspect multi-zone matrix amplifier zones and pause unmonitored upstream streamers to prevent idle phantom power waste.

notify_voice:
  name: Voice Feedback Router
  description: Deliver voice/audio feedback dynamically routed to a specific area or following person presence via central notify_router.
  fields:
    message:
      name: Message
      description: Text or voice announcement to deliver.
      required: true
      selector:
        text:
    area_id:
      name: Target Area
      description: Area where announcement should play.
      required: false
      selector:
        text:
    person_entity_id:
      name: Person Entity ID
      description: Person whose current location determines the output speaker.
      required: false
      selector:
        entity:
          domain: person
    announce:
      name: Announce (audio)
      description: Whether to play audible TTS speech.
      default: true
      selector:
        boolean:
    duck_media:
      name: Duck Active Media
      description: Whether to temporarily duck/attenuate active media playback in the target area during speech.
      default: true
      selector:
        boolean:
    duck_duration:
      name: Duck Duration
      description: Optional override duration in seconds to keep playback ducked before automatic restoration.
      required: false
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: s
    whisper_mode:
      name: Whisper / Quiet Mode
      description: Enforce quiet hours volume ceiling and whisper speech mode.
      default: false
      selector:
        boolean:

get_energy_summary:
  name: Get Energy & Load Summary
  description: Retrieve real-time electrical power telemetry, top device consumers, solar generation status, battery storage, and tariff window.

load_shed:
  name: Execute Load Shedding
  description: Shed non-essential or high-draw deferrable loads (EV charging, pool pumps, climate setbacks) during peak grid tariff hours.
  fields:
    tier:
      name: Load Shed Tier
      description: Maximum load priority tier to shed (1=Deferrable appliances/EV/pumps, 2=Secondary AV/HVAC setbacks).
      default: 1
      required: false
      selector:
        number:
          min: 1
          max: 2
    target_watts:
      name: Target Reduction (Watts)
      description: Optional wattage reduction target. Stops shedding loads once this threshold is reached.
      required: false
      selector:
        number:
          min: 0
          max: 20000
          unit_of_measurement: W
    dry_run:
      name: Dry Run
      description: Preview which loads would be shed and estimated wattage savings without changing state.
      default: false
      required: false
      selector:
        boolean:

restore_shed_loads:
  name: Restore Shed Loads
  description: Restore previously shedded devices back to their pre-shed operation states.
  fields:
    record_id:
      name: Record ID
      description: Specific load-shedding execution record to restore (defaults to latest active record).
      required: false
      selector:
        text:

get_presence_states:
  name: Get Room Presence States
  description: Retrieve live spatial room occupancy probability states fused across mmWave radar, PIR motion, media playback, and BLE tracking.

analyze_camera:
  name: Analyze Camera Snapshot
  description: Capture and evaluate a camera snapshot using Gemini Vision or edge sensors for visitor activity, package deliveries, or safety anomalies.
  fields:
    camera_entity_id:
      name: Camera Entity
      description: Camera entity to capture and audit.
      required: true
      selector:
        entity:
          domain: camera
    prompt:
      name: Vision Analysis Prompt
      description: Specific instructions or query for the Vision analysis.
      required: false
      selector:
        text:

evaluate_contextual_alerts:
  name: Evaluate Contextual Presence Alerts
  description: Audit home perimeter states (garage doors left open, unlocked doors at night, unattended appliances in vacant rooms) and return actionable alerts.

mine_habits:
  name: Mine Historical Habits
  description: Mine Home Assistant SQLite recorder trends for recurring trigger-action lifestyle routines.
  fields:
    days:
      name: Days
      description: Number of days of historical recorder trends to analyze (default 14).
      required: false
      default: 14
      selector:
        number:
          min: 1
          max: 60

get_circadian_curves:
  name: Get Circadian & Seasonal Curves
  description: Calculate adaptive color temperature, brightness, and seasonal HVAC comfort curves.
  fields:
    solar_elevation:
      name: Solar Elevation
      description: Explicit solar elevation in degrees (computed automatically if omitted).
      required: false
      selector:
        number:
          min: -90
          max: 90

audit_habit_deviations:
  name: Audit Habit Deviations
  description: Audit live home state against learned behavioral baselines for missed routines (e.g. bedtime, morning daylight).







audit_unassigned_entities:
  name: Audit Unassigned Entities
  description: Scan Home Assistant entity and device registries for unassigned rooms and compute heuristic & spatial similarity suggestions.
  fields:
    min_confidence:
      name: Minimum Confidence Threshold
      description: Confidence threshold for auto-assignment eligibility (0.0 to 1.0, default 0.85).
      required: false
      default: 0.85
      selector:
        number:
          min: 0.50
          max: 1.00
          step: 0.05

auto_commission_entities:
  name: Autonomous Entity Commissioning
  description: Automatically commission all eligible unassigned entities and devices into matching rooms using zero-config heuristics.
  fields:
    min_confidence:
      name: Minimum Confidence Threshold
      description: Minimum confidence score required to auto-assign (0.0 to 1.0, default 0.85).
      required: false
      default: 0.85
      selector:
        number:
          min: 0.50
          max: 1.00
          step: 0.05

register_federated_node:
  name: Register Federated Edge Node
  description: Register or update a remote Home Assistant instance for multi-node federation and edge synchronization.
  fields:
    node_id:
      name: Node Identifier
      description: Unique identifier slug for the remote node (e.g. guest_house, workshop, camper).
      required: true
      selector:
        text:
    name:
      name: Friendly Name
      description: Descriptive name for the remote edge node.
      required: true
      selector:
        text:
    host:
      name: Hostname or IP
      description: IP address or hostname of the remote Home Assistant instance.
      required: true
      selector:
        text:
    port:
      name: Port
      description: Remote instance HTTP/HTTPS port (default 8123).
      required: false
      default: 8123
      selector:
        number:
          min: 1
          max: 65535
    token:
      name: Long-Lived Access Token
      description: Bearer access token generated on the remote Home Assistant node.
      required: false
      selector:
        text:
    ssl:
      name: Use HTTPS / SSL
      description: Whether the remote node requires HTTPS.
      required: false
      default: false
      selector:
        boolean:
    enabled:
      name: Enabled
      description: Whether edge synchronization is enabled for this node.
      required: false
      default: true
      selector:
        boolean:

remove_federated_node:
  name: Remove Federated Edge Node
  description: Deregister a remote Home Assistant node from multi-node federation.
  fields:
    node_id:
      name: Node Identifier
      description: Identifier of the node to remove.
      required: true
      selector:
        text:

sync_federated_nodes:
  name: Sync Federated Nodes
  description: Synchronize live state machine caches and latency metrics across federated edge nodes.
  fields:
    node_id:
      name: Node Identifier
      description: Specific node to sync (omit to synchronize all active nodes).
      required: false
      selector:
        text:

call_remote_service:
  name: Call Remote Node Service
  description: Dispatch a service call to be executed on a remote federated Home Assistant instance.
  fields:
    node_id:
      name: Node Identifier
      description: Target federated edge node identifier.
      required: true
      selector:
        text:
    domain:
      name: Service Domain
      description: Domain of the remote service (e.g. light, switch, climate).
      required: true
      selector:
        text:
    service:
      name: Service Name
      description: Name of the remote service (e.g. turn_on, turn_off, toggle).
      required: true
      selector:
        text:
    service_data:
      name: Service Data
      description: Key-value parameters passed to the remote service.
      required: false
      selector:
        object:

get_federation_status:
  name: Get Federation Status
  description: Retrieve live health, latency, online status, and synchronization metrics for all federated edge nodes.

get_user_rules:
  name: Get User Rules
  description: Retrieve the user behavioral rules, persona guidelines, and onboarding preferences.

set_user_rules:
  name: Set User Rules
  description: Save or update the user behavioral rules, persona guidelines, and onboarding preferences.
  fields:
    rules:
      name: Rules
      description: The dictionary of behavioral preferences, persona settings, and household rules to persist.
      required: true
      selector:
        object:

duck_media:
  name: Duck Media Playback
  description: Temporarily attenuate (duck) or pause active media playback in targeted and adjacent rooms for voice clarity.
  fields:
    areas:
      name: Target Areas
      description: Room or list of rooms to duck (omit to duck all active media playback).
      required: false
      selector:
        object:
    duck_ratio:
      name: Duck Volume Ratio
      description: Fraction of current volume to retain during speech (e.g. 0.25 = 25% of current volume).
      default: 0.25
      selector:
        number:
          min: 0.05
          max: 0.80
          step: 0.05
    duck_level:
      name: Maximum Ducked Volume Ceiling
      description: Hard maximum volume ceiling (0.0 to 1.0) while ducked.
      default: 0.15
      selector:
        number:
          min: 0.05
          max: 0.50
          step: 0.05
    session_id:
      name: Session Identifier
      description: Optional tracking ID for the ducking session.
      required: false
      selector:
        text:

restore_media:
  name: Restore Ducked Media
  description: Restore previously ducked or paused media players back to their original volumes and states.
  fields:
    session_id:
      name: Session Identifier
      description: Specific ducking session ID to restore, or omit/pass 'all' to restore all active sessions.
      required: false
      selector:
        text:

get_voice_assist_status:
  name: Get Voice Assist Status
  description: Inspect Home Assistant Assist pipelines, voice satellites, wake-word engines, and quiet hours state.

dismiss_recommendation:
  name: Dismiss Recommendation
  description: Mute / dismiss a proactive smart home recommendation so it stays hidden from the Proactive Feed.
  fields:
    recommendation_id:
      name: Recommendation ID
      description: The unique identifier of the recommendation or suggestion to dismiss.
      required: true
      example: "reach_level_2_media"
      selector:
        text:

restore_recommendation:
  name: Restore Recommendation
  description: Unhide / restore a previously dismissed recommendation back to the active Proactive Feed.
  fields:
    recommendation_id:
      name: Recommendation ID
      description: The unique identifier of the recommendation to restore.
      required: true
      example: "reach_level_2_media"
      selector:
        text:

reset_dismissed_recommendations:
  name: Reset Dismissed Recommendations
  description: Clear all ignored and dismissed recommendations, restoring them to the Proactive Feed.

test_local_llm:
  name: Test Local LLM Endpoint
  description: Query a local LLM server (Ollama, vLLM, or LocalAI) for endpoint health, discovered models, and roundtrip latency.
  fields:
    url:
      name: Endpoint URL
      description: Optional override URL (defaults to configured local LLM URL).
      required: false
      example: "http://10.0.12.228:11434"
      selector:
        text:

benchmark_local_llm:
  name: Benchmark Local LLM
  description: Execute a standardized smart home reasoning prompt against the local LLM and record throughput (tokens/sec), generation latency, and inference fidelity.
  fields:
    prompt:
      name: Prompt
      description: Optional custom prompt to benchmark (defaults to standard smart home telemetry reasoning test).
      required: false
      selector:
        text:
    model:
      name: Model
      description: Optional model name to benchmark (defaults to active local LLM model).
      required: false
      example: "qwen2.5:3b"
      selector:
        text:

pull_local_llm_model:
  name: Pull Local LLM Model
  description: Pull and download a local LLM model (such as qwen2.5:3b or qwen2.5:7b) onto the local Ollama instance, test it, and set as active model.
  fields:
    model:
      name: Model Name
      description: The name and tag of the model to pull (e.g. qwen2.5:3b, qwen2.5:7b).
      required: true
      example: "qwen2.5:3b"
      selector:
        text:
    url:
      name: Endpoint URL
      description: Optional override URL (defaults to configured local LLM URL).
      required: false
      example: "http://10.0.12.228:11434"
      selector:
        text:
    test_after_pull:
      name: Test Model After Pull
      description: Automatically benchmark/test the pulled model to verify health before activation (defaults to true).
      required: false
      default: true
      selector:
        boolean:
    set_as_active:
      name: Set as Active in Options
      description: Automatically update integration options to activate the new model upon successful pull and test (defaults to true).
      required: false
      default: true
      selector:
        boolean:

