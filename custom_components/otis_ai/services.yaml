get_capability_map:
  name: Get Capability Map
  description: Compile a complete capability map of the Home Assistant instance, including active integrations, areas, devices, active entities, orphaned entities, and proactive suggestions.

get_suggestions:
  name: Get Proactive Suggestions
  description: Retrieve intelligent proactive suggestions generated by Otis AI based on current areas, entities, and configurations.

apply_suggestion:
  name: Apply Proactive Suggestion
  description: Automatically apply a proactive suggestion (e.g., generate an automation, script, or cleanup orphaned entities).
  fields:
    suggestion_id:
      name: Suggestion ID
      description: The unique identifier of the suggestion to apply.
      required: true
      selector:
        text:

chat:
  name: Chat with Otis
  description: Conversational smart home co-pilot query with active spatial capability context and transparent LLM fallback.
  fields:
    text:
      name: Message
      description: The text sentence or query to send to Otis AI.
      required: true
      selector:
        text:
    conversation_id:
      name: Conversation ID
      description: Optional conversation identifier for maintaining multi-turn context.
      required: false
      selector:
        text:

get_spatial_map:
  name: Get Spatial Adjacency Map
  description: Retrieve the spatial connection topology and area adjacency graph representing physical connections between rooms in the home.

update_spatial_map:
  name: Update Spatial Adjacency Connection
  description: Connect or disconnect two physical areas in the spatial adjacency topology.
  fields:
    area_1:
      name: Area 1
      description: The ID or name of the first area (e.g., 'foyer', 'kitchen').
      required: true
      selector:
        text:
    area_2:
      name: Area 2
      description: The ID or name of the second area (e.g., 'hallway', 'great_room').
      required: true
      selector:
        text:
    connected:
      name: Connected
      description: Whether the two areas are physically connected/adjacent.
      default: true
      selector:
        boolean:
    connection_type:
      name: Connection Type
      description: The physical transition type between the areas ('door', 'open', 'hallway', 'stairs').
      default: open
      selector:
        select:
          options:
            - door
            - open
            - hallway
            - stairs

generate_floorplan:
  name: Generate Floor Plan SVG
  description: Synthesize an interactive vector SVG floor plan with multi-floor and outdoor views based on spatial adjacency and walkthrough inputs.
  fields:
    theme:
      name: Theme
      description: Visual color aesthetic for the floor plan ('cyberpunk', 'blueprint', 'emerald').
      default: cyberpunk
      selector:
        select:
          options:
            - cyberpunk
            - blueprint
            - emerald
    output_path:
      name: Output File Path
      description: Destination path relative to Home Assistant config (defaults to 'www/otis_floorplan.svg').
      default: www/otis_floorplan.svg
      selector:
        text:
    video_path:
      name: Walkthrough Video Path
      description: Optional path to an uploaded walkthrough video file to parse room callouts.
      required: false
      selector:
        text:

update_floorplan_layout:
  name: Update Floor Plan Layout
  description: Reposition device marker badges and adjust room boundary polygon coordinates directly on the vector SVG floor plan.
  fields:
    badges:
      name: Device Marker Badges
      description: List of device markers with entity_id, x, and y coordinates.
      selector:
        object:
    rooms:
      name: Room Boundaries
      description: List of rooms with id, x, y, width, height, or polygon points.
      selector:
        object:
    deleted_rooms:
      name: Deleted Room IDs
      description: List of area/room IDs to delete and remove from the vector floor plan.
      selector:
        object:
    svg_path:
      name: Floor Plan SVG Path
      description: Destination SVG path relative to Home Assistant config.
      default: www/otis_floorplan.svg
      selector:
        text:

generate_theme:
  name: Generate Custom Theme
  description: Generate custom Home Assistant theme definitions directly into /config/themes/otis_<theme_name>.yaml from natural language prompts or presets and automatically reload themes.
  fields:
    prompt:
      name: Theme Prompt
      description: Natural language styling instruction (e.g., 'Cyberpunk neon dark mode with glowing cyan accents and 16px rounded cards').
      required: true
      selector:
        text:
    name:
      name: Theme Name
      description: Optional display name for the theme.
      required: false
      selector:
        text:
    base_palette:
      name: Base Palette Preset
      description: Optional base palette preset ('cyberpunk', 'midnight_slate', 'oled_black', 'sunset_amber', 'emerald_luxury', 'nordic_frost', 'high_contrast').
      required: false
      selector:
        select:
          options:
            - cyberpunk
            - midnight_slate
            - oled_black
            - sunset_amber
            - emerald_luxury
            - nordic_frost
            - high_contrast
    dark_mode:
      name: Dark Mode
      description: Whether the theme is dark mode (true) or light mode (false).
      default: true
      selector:
        boolean:
    border_radius:
      name: Border Radius
      description: Optional border radius override (e.g. '14px', '8px', '0px').
      required: false
      selector:
        text:
    glow_effect:
      name: Glow Effect
      description: Whether cards feature a glowing luminous neon shadow border.
      required: false
      selector:
        boolean:
    apply_immediately:
      name: Apply Immediately
      description: Whether to set and activate this theme immediately across the Home Assistant frontend.
      default: false
      selector:
        boolean:

apply_theme:
  name: Apply Theme
  description: Instantly activate a Home Assistant theme across the frontend.
  fields:
    name:
      name: Theme Name / Key
      description: Theme name or key (e.g., 'otis_cyberpunk', 'otis_midnight_slate').
      required: true
      selector:
        text:
    mode:
      name: Mode
      description: Optional display mode ('dark', 'light', 'auto').
      required: false
      selector:
        select:
          options:
            - dark
            - light
            - auto

list_themes:
  name: List Otis Themes
  description: List all Otis-generated custom themes in /config/themes/ with their color swatches and style properties.

delete_theme:
  name: Delete Otis Theme
  description: Remove a custom Otis theme file from /config/themes/ and reload themes.
  fields:
    name:
      name: Theme Key
      description: Theme key or slug to delete (e.g., 'otis_cyberpunk').
      required: true
      selector:
        text:

run_sentinel_watchdog:
  name: Run Sentinel Watchdog Audit
  description: Run comprehensive Otis Sentinel telemetry scan across climate short-cycling, battery drain, stuck security perimeter access, and failed integration nodes.

remediate_anomaly:
  name: Remediate Sentinel Anomaly
  description: Trigger 1-click self-healing remediation for an anomaly detected by Otis Sentinel.
  fields:
    anomaly_id:
      name: Anomaly ID
      description: Identifier of the anomaly to remediate.
      required: true
      selector:
        text:
    action:
      name: Action Override
      description: Optional remediation action override (e.g., 'secure_perimeter_entity', 'adjust_climate_target', 'reload_config_entry', 'dismiss').
      required: false
      selector:
        text:

get_sentinel_telemetry:
  name: Get Sentinel Telemetry
  description: Retrieve live Sentinel anomaly monitoring status, active anomalies list, and remediation history.

ignore_sentinel_alert:
  name: Ignore Sentinel Alert
  description: Mute a specific Sentinel alert or an entire alert category from the Proactive Feed.
  fields:
    anomaly_id:
      name: Anomaly ID
      description: Specific anomaly ID to mute (optional if all_in_category is true).
      required: false
      selector:
        text:
    category:
      name: Alert Category
      description: Category to mute (e.g. 'battery', 'offline_node').
      required: false
      selector:
        text:
    all_in_category:
      name: Ignore All in Category
      description: Set to true to mute all current and future alerts in this category.
      required: false
      selector:
        boolean:

sync_dashboards:
  name: Sync Dashboards
  description: Synchronize Studios (Floor Plan, Media, Security, Climate) and Room views from the Otis AI Companion dashboard to the user Command Center dashboard.

create_command_center:
  name: Create / Sync User Command Center
  description: Generate or refresh the non-admin User Command Center dashboard (/command-center) connecting Studios and Room subviews for family members.

execute_macro:
  name: Execute Macro Sequence
  description: Execute a multi-step smart home macro sequence with pre-flight safety checks and prior state snapshotting for 1-click rollback.
  fields:
    macro_name:
      name: Macro Name / Template
      description: Built-in macro template name ('movie_night', 'goodnight', 'party_mode', 'away_mode', 'welcome_home') or custom display name.
      required: false
      selector:
        text:
    steps:
      name: Macro Steps
      description: Optional list of customized action steps to execute sequentially.
      required: false
      selector:
        object:
    confirmed:
      name: Confirmed
      description: Explicit confirmation flag to bypass pre-flight safety prompts for critical steps (e.g. locks/disarm).
      default: false
      selector:
        boolean:
    macro_id:
      name: Macro ID
      description: Unique identifier for tracking and pending confirmations.
      required: false
      selector:
        text:

rollback_macro:
  name: Rollback Macro
  description: Roll back the most recently executed macro (or specified macro ID), restoring all target entities to their exact pre-execution state.
  fields:
    macro_id:
      name: Macro ID
      description: Specific macro execution ID to roll back (defaults to latest executed macro).
      required: false
      selector:
        text:

list_macros:
  name: List Macros & Execution History
  description: List available built-in smart macro templates and recent execution history with rollback statuses.

audio_handoff:
  name: Audio Handoff
  description: Transfer or mirror playing audio between rooms across multi-zone matrix amplifiers and media players, validated via Spatial Adjacency.
  fields:
    source_area:
      name: Source Area / Room
      description: The room/area currently playing audio or being departed.
      required: true
      selector:
        text:
    target_area:
      name: Target Area / Room
      description: The room/area being entered where audio should follow or transfer.
      required: true
      selector:
        text:
    mode:
      name: Handoff Mode
      description: Mode of transfer ('handoff' moves audio and turns off source room; 'follow' or 'mirror' keeps both rooms synchronized).
      default: handoff
      selector:
        select:
          options:
            - handoff
            - follow
            - mirror
    idle_power_guard:
      name: Idle Power Guard
      description: Automatically check for and release idle upstream streamer and amplifier sources.
      default: true
      selector:
        boolean:

media_follow_me:
  name: Media Follow-Me Routing
  description: Dynamically evaluate presence and follow user audio into newly entered rooms.
  fields:
    source_area:
      name: Source Area
      required: true
      selector:
        text:
    target_area:
      name: Target Area
      required: true
      selector:
        text:
    mode:
      name: Mode
      default: follow
      selector:
        select:
          options:
            - follow
            - handoff

release_idle_sources:
  name: Release Idle Matrix Sources
  description: Inspect multi-zone matrix amplifier zones and pause unmonitored upstream streamers to prevent idle phantom power waste.

notify_voice:
  name: Voice Feedback Router
  description: Deliver voice/audio feedback dynamically routed to a specific area or following person presence via central notify_router.
  fields:
    message:
      name: Message
      description: Text or voice announcement to deliver.
      required: true
      selector:
        text:
    area_id:
      name: Target Area
      description: Area where announcement should play.
      required: false
      selector:
        text:
    person_entity_id:
      name: Person Entity ID
      description: Person whose current location determines the output speaker.
      required: false
      selector:
        entity:
          domain: person
    announce:
      name: Announce (audio)
      description: Whether to play audible TTS speech.
      default: true
      selector:
        boolean:




