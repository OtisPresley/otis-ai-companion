query_knowledge_base:
  name: Query Knowledge Base (RAG)
  description: Perform hybrid semantic vector and lexical keyword retrieval across indexed smart home manuals, guides, and historical event logs.
  fields:
    query:
      name: Search Query
      description: Question or search phrase (e.g. "What does blinking amber light on switch mean?").
      required: true
      selector:
        text:
    limit:
      name: Max Results
      description: Maximum number of relevant knowledge chunks to return.
      required: false
      default: 3
      selector:
        number:
          min: 1
          max: 10
    category:
      name: Category Filter
      description: Optional filter to restrict search to a specific category.
      required: false
      selector:
        text:
    min_score:
      name: Minimum Relevance Score
      description: Threshold similarity score (0.0 to 1.0) below which results are excluded.
      required: false
      default: 0.12
      selector:
        number:
          min: 0.0
          max: 1.0
